name: CI

on:
  push:
    branches-ignore: []
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TS verify
        run: pnpm verify
      - name: Go vet
        run: cd backend && go vet ./...
      - name: Go test
        run: pnpm backend:test
      - name: Go race (core packages)
        run: cd backend && go test -race ./internal/api ./internal/app ./internal/im ./internal/research ./internal/runtime -timeout 600s
      - name: Go cross-build (Windows/Linux)
        run: |
          cd backend
          GOOS=windows GOARCH=amd64 go build -o /tmp/zynote-core-windows.exe ./cmd/zynote-core
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=amd64 go build -o /tmp/zynote-core-linux ./cmd/zynote-core
          GOOS=linux GOARCH=amd64 go build ./...
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: native
      - name: Rust test
        run: pnpm native:test
      - name: Build
        run: pnpm build
      - name: Build Go core
        shell: bash
        run: |
          mkdir -p backend/bin
          cd backend
          go build -trimpath -ldflags="-s -w" -o "bin/zynote-core$(go env GOEXE)" ./cmd/zynote-core
      - name: Go core smoke
        run: pnpm smoke:go-core
  go-test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Go test and vet
        run: cd backend && go vet ./... && go test ./...
