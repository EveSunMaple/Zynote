[package]
name = "zynote-native"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
serde = {version = "1", features = ["derive"]}
serde_json = "1"
pdfium-render = "0.8"
lopdf = "0.46.0"
rustypipe = "0.11.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ort = "2.0.0-rc.15"
tokenizers = { version = "0.21.4", default-features = false, features = ["fancy-regex"] }
docling-asr = "2.51.0"
docling-onnx = "2.51.0"

[target.'cfg(windows)'.dependencies]
hmac = "0.12"
md-5 = "0.10"
pbkdf2 = "0.12"
rusqlite = {version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"]}
sha2 = "0.10"
zstd = "0.13"
